# Official NIRF 2025 ranks for institutes in the routes beyond JEE, read from nirfindia.org on 2026-11-08.
# A rank applies only where the counselling document names the same ranked institution. Each `match` is the
# start of the institute name exactly as the counselling document prints it.
# Left unmatched on purpose, so they count as neutral:
# - IMS BHU Dental: NIRF lists both Banaras Hindu University (Dental 15) and "Faculty of Dental Sciences,
#   Institute of Medical Sciences, Varanasi" (Dental 18), so it's unclear which applies.
# - Amrita: NIRF lists the university at Coimbatore, but the medical and dental colleges here are at Kochi and Faridabad.
# - Separate campuses of a ranked university: JIPMER Karaikal, Datta Meghe Nagpur, SOA campus II, ICT Jalna, DY Patil Kolhapur.
