# Official websites for institutes in the routes beyond JEE. Each entry says where the address came from.
# `match` is the start of the institute name exactly as the counselling document prints it. A campus listed
# separately (such as GNLU Silvassa) gets its university's website, with a note.
sources:
  consortium:
    title: Consortium of National Law Universities, member universities
    url: https://consortiumofnlus.ac.in/
    retrieved: "2026-11-11"
    status: official
  confirmed:
    title: Address listed on Wikidata, confirmed because the site publishes the institute's own NIRF submission
    url: https://www.wikidata.org/
    retrieved: "2026-11-11"
    status: confirmed
